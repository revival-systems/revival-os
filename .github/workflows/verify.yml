# Independent verification of Revival OS on a clean GitHub-hosted runner.
#
# Runs ONLY when a person starts it (workflow_dispatch). Pushes and pull
# requests never start it, so it uses no Actions minutes by itself. It runs
# the same `make` targets as local development (docs/DEVELOPMENT.md). Start it
# at phase milestones, as docs/CI-STRATEGY.md describes. Read that document
# before adding any trigger.
name: Revival OS verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revival-os-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: make check (clean ubuntu-24.04 runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm shellcheck cppcheck

      - name: Install pinned toolchains (SHA-256 verified)
        run: make install-toolchain

      - name: Record tool versions
        run: make doctor

      - name: make check
        run: make check
